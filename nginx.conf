user www-data;
worker_processes auto;
pid /run/nginx.pid;

# Log errors to stderr so they appear in container/Railway logs
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log access to stdout for debugging
    access_log /dev/stdout;

    sendfile        on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /var/www/html/public;
        index index.php index.html;

        # Health check endpoint — no PHP required
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Serve static files directly; fall back to Laravel front controller
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Pass PHP requests to PHP-FPM
        location ~ \.php$ {
            # Return 404 for scripts that don't exist on disk (prevents
            # passing non-existent paths to PHP-FPM)
            try_files $uri =404;

            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;

            # Explicitly set SCRIPT_FILENAME using the real document root
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;
            include       fastcgi_params;

            # FastCGI timeout settings — surface slow/hung PHP-FPM quickly
            fastcgi_connect_timeout  10s;
            fastcgi_send_timeout     60s;
            fastcgi_read_timeout     60s;

            # Pass upstream errors through so they appear in nginx error log
            fastcgi_intercept_errors on;
        }

        # Deny access to hidden files (e.g. .env, .git)
        location ~ /\. {
            deny all;
        }

        # Custom error pages — return plain JSON-friendly responses
        error_page 404 /index.php;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
